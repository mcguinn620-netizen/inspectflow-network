<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>Drive Smooth Inspector</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --app-header-h: 3.5rem;
        --app-tabbar-h: 3.5rem;
      }
      html, body, #root { height: 100%; }
      body { overscroll-behavior-y: none; }
    </style>
    <meta name="description" content="Field execution tool for vehicle inspectors — schedule, trips, jobs, and tax." />
    <meta name="author" content="Drive Smooth" />

    <!-- PWA — manifest is injected at runtime, and only on production hosts. -->
    <script>
      // Preview-safe PWA gating. The Lovable mobile-preview renderer trips its
      // "couldn't render" heuristic when it sees a manifest link or a service
      // worker in the iframe, so we NEVER emit either in preview / dev / editor
      // contexts. The decision is cached on window for /src/main.tsx to reuse.
      (function () {
        function isPreviewEnv() {
          try {
            if (window.self !== window.top) return true;
          } catch (e) {
            return true; // cross-origin frame access threw → treat as preview
          }
          var h = (window.location.hostname || "").toLowerCase();
          if (!h) return true;
          if (h === "localhost" || h === "127.0.0.1" || h === "0.0.0.0") return true;
          if (h.endsWith(".local")) return true;
          var needles = [
            "lovableproject.com",
            "lovableproject-dev.com",
            "lovable.app",
            "lovable.dev",
            "id-preview--",
            "preview--",
            "sandbox.lovable",
          ];
          for (var i = 0; i < needles.length; i++) {
            if (h.indexOf(needles[i]) !== -1) return true;
          }
          try {
            if (/[?&](sw=off|preview=1)\b/.test(window.location.search || "")) return true;
          } catch (e) {}
          return false;
        }
        var preview = isPreviewEnv();
        window.__LOVABLE_IS_PREVIEW__ = preview;
        if (!preview) {
          var link = document.createElement("link");
          link.rel = "manifest";
          link.href = "/manifest.webmanifest";
          link.id = "app-manifest";
          document.head.appendChild(link);
        }
      })();
    </script>
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inspector" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <!-- iOS splash screens (uses 512 icon as fallback to avoid blank flash) -->
    <link rel="apple-touch-startup-image" href="/icons/icon-512.png" />

    <meta property="og:title" content="Drive Smooth Inspector" />
    <meta property="og:description" content="Schedule, trips, jobs, and tax for vehicle inspectors." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
