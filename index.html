<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>Drive Smooth Inspector</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --app-header-h: 3.5rem;
        --app-tabbar-h: 3.5rem;
      }
      html, body, #root { height: 100%; }
      body { overscroll-behavior-y: none; }
    </style>
    <meta name="description" content="Field execution tool for vehicle inspectors — schedule, trips, jobs, and tax." />
    <meta name="author" content="Drive Smooth" />

    <!-- PWA -->
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Strip the manifest link inside Lovable preview iframes — the asset is
      // auth-gated there and the 401 trips Lovable's preview render heuristic.
      (function () {
        try {
          var h = window.location.hostname;
          var inIframe = window.self !== window.top;
          if (
            inIframe ||
            h.indexOf("lovableproject.com") !== -1 ||
            h.indexOf("lovable.app") !== -1 ||
            h.indexOf("id-preview--") !== -1
          ) {
            var l = document.getElementById("app-manifest");
            if (l && l.parentNode) l.parentNode.removeChild(l);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inspector" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <!-- iOS splash screens (uses 512 icon as fallback to avoid blank flash) -->
    <link rel="apple-touch-startup-image" href="/icons/icon-512.png" />

    <meta property="og:title" content="Drive Smooth Inspector" />
    <meta property="og:description" content="Schedule, trips, jobs, and tax for vehicle inspectors." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
