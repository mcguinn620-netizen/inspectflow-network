format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other

meta:
  bitrise.io:
    stack: osx-xcode-26.4.x

workflows:
  build:
    description: Build and test iOS Capacitor app on Bitrise.
    steps:
      - git-clone@8: {}
      - restore-spm-cache@3: {}
      - script@1:
          title: npm ci
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euxo pipefail
                npm ci
      - script@1:
          title: npm run build
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euxo pipefail
                npm run build
      - script@1:
          title: Capacitor sync iOS
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euxo pipefail
                npx cap sync ios
      - script@1:
          title: Install CocoaPods dependencies
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euxo pipefail
                cd ios/App
                pod install
      - script@1:
          title: List available iOS simulators
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euxo pipefail
                xcrun simctl list devices available
      - xcode-build-for-test@3:
          inputs:
            - project_path: ios/App/App.xcworkspace
            - scheme: App
            - destination: platform=iOS Simulator,name=Bitrise iOS default,OS=latest
      - save-spm-cache@1: {}
      - deploy-to-bitrise-io@2: {}
