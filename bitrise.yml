---
format_version: '26'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios
workflows:
  build:
    summary: Compile the native SwiftUI app for the iOS Simulator (no signing).
    description: |
      Resolves the local InspectFlowConnector Swift Package and compiles the
      AutoInspectorNetwork app for an iPhone simulator. Use this on every push
      to catch source/connector regressions before archiving.
    steps:
    - git-clone@8: {}
    - restore-spm-cache@3: {}
    - script@1: {}
    title: Resolve Swift Packages
    inputs:
    - content: |-
        #!/bin/bash
        xcodebuild -resolvePackageDependencies -project "$BITRISE_PROJECT_PATH" -scheme "$BITRISE_SCHEME"
    - xcode-build-for-test@3:
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - destination: platform=iOS Simulator,name=Bitrise iOS default,OS=latest
        - cache_level: none
        - output_dir: "$BITRISE_DEPLOY_DIR"
        - automatic_code_signing: 'off'
    - save-spm-cache@1: {}
    - deploy-to-bitrise-io@2:
        inputs:
        - is_compress: false
        - is_enable_public_page: true
        - deploy_path: "$BITRISE_DEPLOY_DIR"
        - notify_user_groups: Everyone
    triggers:
      push:
      - branch: main
  archive_and_export_app:
    summary: Archive AutoInspectorNetwork and export an IPA for distribution.
    description: |
      Resolves Swift Packages, archives the app with automatic code signing
      using the configured Apple Developer team, and exports an IPA.
    steps:
    - git-clone@8: {}
    - restore-spm-cache@3: {}
    - certificate-and-profile-installer@1: {}
    - xcode-archive@6:
        inputs:
        - workdir: "./ios-native"
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - distribution_method: "$BITRISE_DISTRIBUTION_METHOD"
        - automatic_code_signing: 'off'
        - platform: iOS
    - save-spm-cache@1: {}
    - script@1:
        title: Copy exported IPA to deploy dir
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            echo "IPA path: ${BITRISE_IPA_PATH:-}"
            if [ -z "${BITRISE_IPA_PATH:-}" ]; then
              echo "BITRISE_IPA_PATH is not set; the Xcode Archive step did not export an IPA."
              exit 1
            fi
            if [ ! -f "$BITRISE_IPA_PATH" ]; then
              echo "IPA file not found at: $BITRISE_IPA_PATH"
              exit 1
            fi
            mkdir -p "$BITRISE_DEPLOY_DIR"
            cp "$BITRISE_IPA_PATH" "$BITRISE_DEPLOY_DIR/"
            ls -lah "$BITRISE_DEPLOY_DIR"
    - deploy-to-bitrise-io@2: {}
    triggers:
      pull_request:
      - target_branch: main
        draft_enabled: false
meta:
  bitrise.io:
    stack: osx-xcode-26.4.x
    machine_type_id: g2.mac.large
app:
  envs:
  - BITRISE_PROJECT_PATH: AutoInspectorNetwork.xcodeproj
    opts:
      is_expand: true
  - BITRISE_SCHEME: AutoInspectorNetwork
    opts:
      is_expand: true
  - BITRISE_DISTRIBUTION_METHOD: ad-hoc
    opts:
      is_expand: true
