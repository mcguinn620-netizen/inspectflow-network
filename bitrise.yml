format_version: '26'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

workflows:
  build:
    summary: Compile the native SwiftUI app for the iOS Simulator.
    steps:
    - git-clone@8: {}
    - restore-spm-cache@3: {}
    - script@1:
        title: Path and Package Validation
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            echo "Checking for Package.swift in root..."
            if [ -f "Package.swift" ]; then
              echo "✅ Package.swift found in root."
            else
              echo "❌ Package.swift NOT found in root. Check repository structure."
              ls -R
              exit 1
            fi
    - script@1:
        title: Resolve Swift Packages
        inputs:
        - content: |-
            #!/bin/bash
            # No 'cd' command here
            xcodebuild -resolvePackageDependencies \
               -workspace ios-native/VehicleInspectorsApp.xcworkspace \
               -scheme VehicleInspectorsApp
    - xcode-build-for-test@3:
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - destination: platform=iOS Simulator,name=Bitrise iOS default,OS=latest
        - automatic_code_signing: 'off'
    - save-spm-cache@1: {}
    - deploy-to-bitrise-io@2:
        inputs:
        - deploy_path: "$BITRISE_DEPLOY_DIR"

  archive_and_export_app:
    summary: Archive VehicleInspectorsApp and export an IPA.
    steps:
    - git-clone@8: {}
    - restore-spm-cache@3: {}
    - certificate-and-profile-installer@1: {}
    - script@1:
        title: Fix Package Resolution
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            cd ios-native
            # Manually resolve before archiving to prevent 'vagrant' naming issues
            xcodebuild -resolvePackageDependencies -workspace VehicleInspectorsApp.xcworkspace -scheme "$BITRISE_SCHEME"
    - xcode-archive@6:
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - distribution_method: "$BITRISE_DISTRIBUTION_METHOD"
        - automatic_code_signing: 'off'
        - platform: iOS
        - verbose_log: 'yes'
    - save-spm-cache@1: {}
    - deploy-to-bitrise-io@2: {}
    triggers:
      pull_request:
      - target_branch: main

meta:
  bitrise.io:
    stack: osx-xcode-26.4.x
    machine_type_id: g2.mac.large

app:
  envs:
  - BITRISE_PROJECT_PATH: ios-native/VehicleInspectorsApp.xcworkspace
    opts:
      is_expand: true
  - BITRISE_SCHEME: VehicleInspectorsApp
    opts:
      is_expand: true
  - BITRISE_DISTRIBUTION_METHOD: ad-hoc
    opts:
      is_expand: true
